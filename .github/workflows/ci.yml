name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS XCFramework and example
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          cmake --version

      - name: Download pinned MuJoCo source
        run: make download

      - name: Build XCFramework
        run: make build

      - name: Typecheck Swift wrapper and example
        run: make typecheck

      - name: Build example app
        run: |
          xcodebuild \
            -project examples/MujocoExample/MujocoExample.xcodeproj \
            -scheme MujocoExample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
