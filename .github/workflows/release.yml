name: Release XCFramework

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload release assets
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version

      - name: Resolve release tag
        id: release-tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download pinned MuJoCo source
        run: make download

      - name: Build XCFramework
        run: make build

      - name: Package release artifacts
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: make package-release

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                generate_release_notes: true,
                draft: false,
                prerelease: tag.includes("-"),
              });
            }

            const files = [
              "dist/mujoco.xcframework.zip",
              "dist/mujoco.xcframework.zip.checksum",
              "dist/Package.binary-target.snippet.swift",
            ];

            for (const file of files) {
              const name = path.basename(file);
              const data = fs.readFileSync(file);
              const existing = release.data.assets.find((asset) => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }
